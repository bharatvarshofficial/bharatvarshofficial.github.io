<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d1117">

    <title>BharatVarshOfficial | Admin Login</title>

    <link rel="icon" href="./assets/logo.png">
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <main class="login-container">
        <img
            class="admin-logo"
            src="./assets/logo.png"
            alt="BharatVarshOfficial"
        >

        <span class="admin-eyebrow">SECURE ADMIN ACCESS</span>

        <h1>BharatVarshOfficial</h1>
        <h2>Admin Dashboard</h2>

        <p class="login-description">
            Continue with the authorized Google account. Access is verified
            using the Firebase Admin UID, not a Gmail password.
        </p>

        <button
            type="button"
            id="googleAdminLogin"
            class="google-login-btn"
        >
            <span class="google-icon" aria-hidden="true">G</span>
            <span id="googleAdminLoginLabel">Continue with Google</span>
        </button>

        <div
            id="statusMessage"
            class="status-message hidden"
            role="status"
            aria-live="polite"
        ></div>

        <p class="security-note">
            🔒 Only the approved BharatVarshOfficial administrator can enter.
        </p>

        <a class="home-link" href="./index.html">
            ← Return to website
        </a>
    </main>

    <script type="module" src="./admin.js"></script>
</body>

</html>
